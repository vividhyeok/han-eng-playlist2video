name: Windows desktop release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Validate desktop startup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q app main.py
          python -c "from PyQt6.QtWidgets import QApplication; from app.ui.main_window import MainWindow; app=QApplication([]); window=MainWindow(); assert window.windowTitle() == 'Lyric Video Maker'; print('desktop startup ok')"
      - name: Build standalone app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LyricVideoMaker `
            --add-binary "bin/ffmpeg/bin/ffmpeg.exe;bin/ffmpeg/bin" `
            --add-binary "bin/ffmpeg/bin/ffprobe.exe;bin/ffmpeg/bin" `
            --collect-all genieapi `
            --collect-all yt_dlp `
            main.py
      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LyricVideoMaker.exe")) { throw "EXE was not created" }
          $process = Start-Process -FilePath "dist/LyricVideoMaker.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged app exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LyricVideoMaker-Windows
          path: dist/LyricVideoMaker.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/LyricVideoMaker.exe#LyricVideoMaker-Windows.exe" `
            --target "${{ github.sha }}" `
            --title "Lyric Video Maker ${{ github.ref_name }}" `
            --generate-notes
