<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lyric Video Maker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="eyebrow">LOCAL WORKBENCH</div><h1>Lyric Video Maker</h1><p>정상 곡은 자동으로 통과시키고, 문제가 있는 곡만 확인합니다.</p></div>
      <div class="top-actions"><button class="ghost" id="openOutput">결과 폴더</button><button class="ghost" id="settingsBtn">설정</button><button class="ghost danger" id="shutdownBtn">종료</button></div>
    </header>
    <section class="input-card">
      <div class="input-wrap"><input id="mainInput" autocomplete="off" placeholder="곡명 · YouTube URL · 앨범/플레이리스트 URL" /><button id="analyzeBtn" class="primary">분석 시작</button></div>
      <div class="microcopy">곡 1개도, YouTube Music/YouTube 플레이리스트도 같은 큐로 처리됩니다.</div>
    </section>
    <section class="summary-grid">
      <button class="stat active" data-filter="all"><strong id="countAll">0</strong><span>전체</span></button>
      <button class="stat" data-filter="ready"><strong id="countReady">0</strong><span>READY</span></button>
      <button class="stat" data-filter="review"><strong id="countReview">0</strong><span>확인 필요</span></button>
      <button class="stat" data-filter="done"><strong id="countDone">0</strong><span>완료</span></button>
      <button class="stat" data-filter="failed"><strong id="countFailed">0</strong><span>실패</span></button>
    </section>
    <section class="workspace">
      <div class="queue-head"><div><h2>작업 큐</h2><p id="activity">대기 중</p></div><button id="renderBtn" class="primary wide" disabled>READY 전체 렌더</button></div>
      <div id="errorBanner" class="error-banner hidden"></div><div id="queue" class="queue empty-state">입력 후 분석을 시작하세요.</div>
    </section>
  </main>
  <div id="drawerBackdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer"><div class="drawer-head"><div><div class="eyebrow">TRACK DETAIL</div><h3 id="drawerTitle">곡 상세</h3></div><button class="icon" id="closeDrawer">×</button></div><div id="drawerBody"></div></aside>
  <div id="modalBackdrop" class="modal-backdrop hidden"><section class="modal" id="modal"><div class="modal-head"><div><div class="eyebrow" id="modalEyebrow">REVIEW</div><h3 id="modalTitle">확인</h3></div><button class="icon" id="modalClose">×</button></div><div id="modalBody"></div></section></div>
  <script src="/static/app.js"></script>
</body>
</html>
